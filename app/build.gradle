apply plugin: 'com.android.application'
//apply plugin: 'com.google.gms.google-services'

android {
    compileSdkVersion 34

    buildToolsVersion "33.0.2"
    defaultConfig {
        applicationId "com.sensel.driverapp"
        minSdkVersion 19
        targetSdkVersion 34
        multiDexEnabled true
        versionCode 68
        versionName "8.4.1"
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }

    signingConfigs {
        release {
            storeFile file("../driverapp.jks")
            storePassword "sensel"
            keyAlias "drievrapp"
            keyPassword "sensel"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    useLibrary 'org.apache.http.legacy'
    flavorDimensions "default"
    productFlavors {
        green_earth {
            applicationIdSuffix '.green_earth'
        }
        total {
            applicationIdSuffix ''
        }
        adani {
            applicationIdSuffix '.adani_driver'
        }

    }
    compileOptions {
        sourceCompatibility = '11'
        targetCompatibility = '11'
    }

    namespace 'com.sensel.driverapp'
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation files('libs/ksoap2-android-assembly-2.5.8-jar-with-dependencies.jar')
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'com.google.android.gms:play-services-maps:17.0.0'
    //implementation 'com.google.firebase:firebase-crashlytics-buildtools:2.9.9'
    testImplementation 'junit:junit:4.12'
    //implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    //implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.google.android.material:material:1.1.0-beta01'
//implementation 'org.apache.httpcomponents:httpmime:4.5.10'
    //implementation 'com.journeyapps:zxing-android-embedded:3.4.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    def room_version = "2.2.2"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
//    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.squareup.retrofit2:retrofit:2.5.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.5.0'
    /*implementation 'com.squareup.okhttp3:logging-interceptor:3.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'com.squareup.okhttp3:okhttp-urlconnection:3.11.0'*/
    implementation 'com.squareup.okhttp3:logging-interceptor:3.11.0'
    implementation 'com.squareup.okhttp3:okhttp:3.12.0'
    implementation 'com.squareup.okhttp3:okhttp-urlconnection:3.11.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.jakewharton:butterknife:10.0.0'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.0.0'
    implementation 'com.github.bumptech.glide:glide:4.10.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    //implementation "com.google.android.gms:play-services-gcm:17.0.0"
    implementation 'androidx.legacy:legacy-support-v13:1.0.0'
    implementation 'com.airbnb.android:lottie:3.4.1'
    implementation 'de.hdodenhof:circleimageview:2.1.0'
    implementation 'com.android.support:multidex:1.0.3'
//    implementation 'com.android.volley:volley:1.1.1'
     //implementation 'com.budiyev.android:code-scanner:2.3.2'
    implementation 'com.google.zxing:core:3.3.3'
    implementation 'androidx.annotation:annotation:1.3.0'

    implementation 'com.google.code.gson:gson:2.8.6'
    //implementation 'org.apache.httpcomponents:httpcore:4.4.12'
    implementation 'org.apache.httpcomponents:httpcore:4.4.15'

    implementation 'androidx.work:work-runtime:2.7.1'
    implementation 'androidx.work:work-runtime-ktx:2.7.1'
    implementation 'androidx.work:work-runtime-ktx:2.7.0-alpha04'
    implementation "com.google.android.gms:play-services-gcm:17.0.0"
    implementation 'com.google.firebase:firebase-analytics:17.2.1'
    implementation('org.apache.httpcomponents:httpmime:4.3.6') {
        exclude module: 'httpclient'
    }



}
apply plugin: 'com.google.gms.google-services'
apply plugin: 'maven-publish'
