                    }
                    else {
                        for (var i = 0; i < Places.length; i++) {
                            if (isroute)
                                createMarkerJRM(Places[i], current_position, img);
                            else
                                createMarkerTotal(Places[i], current_position);
                        }
                        var flightPlanCoordinates = [
                        ];
                        for (i = 0; i < Places.length; i++) {
                            flightPlanCoordinates.push(new google.maps.LatLng(Places[i].Latitude, Places[i].Longitude));
                            if (minlat > parseFloat(Places[i].Latitude))

                            if (minlong > parseFloat(Places[i].Longitude))

                            if (maxlat < parseFloat(Places[i].Latitude))
                                maxlat = parseFloat(Places[i].Latitude);
                            if (maxlong < parseFloat(Places[i].Longitude))

                        }

                        bounds = new google.maps.LatLngBounds(new google.maps.LatLng(minlat, minlong), new google.maps.LatLng(maxlat, maxlong));
                        map.fitBounds(bounds);
                        $(".ajaxloader").fadeOut("slow");
                    }

        //***********************************CALCULATE DISTANCE****************************************************
        var duration = new Array();
        function calculate_distance(orgin, destination, place, infowindow) {
            $(".ajaxloader").fadeIn("slow");
            var distance = 0;
            var org = new Array();
            org[0] = orgin;
            var dest = new Array();
            dest[0] = destination;

            var service = new google.maps.DistanceMatrixService();
            service.getDistanceMatrix(
                {
                    origins: org,
                    destinations: dest,
                    travelMode: google.maps.TravelMode.DRIVING,
                    avoidHighways: false,
                    avoidTolls: false
                },
                function (response, status) {
                    if (status == google.maps.DistanceMatrixStatus.OK) {
                        distance = response.rows[0].elements[0].distance.text
                        var destinations = response.destinationAddresses;
                        var results = response.rows[0].elements;
                        if (googleplace) {
                            createhtml(place, distance, infowindow);
                        }
                        else {
                            if (place.Address == "0")
                                place.Address = destinations[0];
                            createHTMLTotal(place, distance, infowindow);
                        }
                        $(".ajaxloader").fadeOut("slow");
                    }
                });
        }

        function DrawAutoRoute() {
            $(".ajaxloader").fadeIn("slow");

            // directionsRenderer = new google.maps.DirectionsRenderer(directionsRendererOptions);
            var directionsService = new google.maps.DirectionsService();
            var ref_points = [];
            var directionsRequest = {};
            directionsRequest.destination = destlatlng;
            directionsRequest.origin = current_position;
            directionsRequest.travelMode = google.maps.TravelMode.DRIVING;
            directionsService.route(directionsRequest, function (result, status) {
                if (status === google.maps.DirectionsStatus.OK) {
                    directionsRenderer.setOptions({ suppressMarkers: true });
                    directionsRenderer.setDirections(result);
                    directionsRenderer.setMap(map);
                    result = directionsRenderer.getDirections();
                    pointsArray = result.routes[0].overview_path;
                    points = result.routes[0].legs[0].steps;
                    var i = 0;
                    var j = 0;
                    var latlng = "";
                    var count = 0;
                    var time = 0;
                    for (j = 0; j < result.routes[0].legs[0].steps.length; j++) {
                        for (i = 0; i < result.routes[0].legs[0].steps[j].lat_lngs.length; i++) {
                            latlng = latlng + result.routes[0].legs[0].steps[j].lat_lngs[i].lat() + ",";
                            latlng = latlng + result.routes[0].legs[0].steps[j].lat_lngs[i].lng() + " | ";
                            ref_points[count] = "(" + result.routes[0].legs[0].steps[j].lat_lngs[i].lat() + "," + result.routes[0].legs[0].steps[j].lat_lngs[i].lng() + ")";
                            count++;
                        }
                    }
                }
                else {
                    JSInterface.displayMessege("unable to find route");
                }
                $(".ajaxloader").fadeOut("slow");
            });
        }

        //***********************************Night Duration ****************************************************
        function getNightDuration() {
            if (nightpoints.length >= 6) {
                for (var a = 2; a < nightpoints.length - 3; a = a + 3) {
                    for (var b = a + 3; b < nightpoints.length; b = b + 3) {
                        if (nightpoints[a] > nightpoints[b]) {
                            var temp = nightpoints[a - 2];
                            nightpoints[a - 2] = nightpoints[b - 2];
                            nightpoints[b - 2] = temp;
                            temp = nightpoints[a - 1];
                            nightpoints[a - 1] = nightpoints[b - 1];
                            nightpoints[b - 1] = temp;
                            temp = nightpoints[a];
                            nightpoints[a] = nightpoints[b];
                            nightpoints[b] = temp;
                        }
                    }
                }

                var durationcount = 0;
                for (var c = 0; c < nightpoints.length; c = c + 3) {
                    if ((nightpoints[c] >= 600) && (nightpoints[c] <= 900)) {
                        durationcount++;
                        if (c == nightpoints.length - 3) {
                            nightmarker(nightpoints[c + 1], nightpoints[c - (durationcount * 3) + 1]);
                            durationcount = 0;
                        }
                    }
                    else {
                        if (durationcount > 1) {
                            nightmarker(nightpoints[c - 2], nightpoints[c - (durationcount * 3) + 1]);
                            durationcount = 0;
                        }
                        else
                            durationcount = 0;
                    }
                }
            }
            for (var i = 0; i < markedSpots.length; i++) {
                if (checkNightzone(markedSpots[i]["Loc"].lat(), markedSpots[i]["Loc"].lng())) {
                    insertResponse(null, markedSpots[i]["Name"], "1", markedSpots[i]["Loc"].lat() + "," + markedSpots[i]["Loc"].lng());
                }
            }
        }

                            ref_points[count] = "(" + result.routes[0].legs[0].steps[j].lat_lngs[i].lat() + "," + result.routes[0].legs[0].steps[j].lat_lngs[i].lng() + ")";
                            count++;

                        }

                    }

                    //marker for Accident vehicle
                    var marker = new google.maps.Marker({
                        map: map,
                        position: ltlg,
                    });
                    var infowindow = new google.maps.InfoWindow();
                    infowindow.setContent("<b>" + data[0].VehicleID + "<b/><br/>" + data[0].Location + "<br/>" + data[0].DateTime + " " + data[0].Time + "<br/>" + GetStatus(data[0].remarks.toUpperCase()));

                    google.maps.event.addListener(marker, 'mousedown', function () {
                        if (activeWindow != null)
                            activeWindow.close();
                        activeWindow = infowindow;
                        infowindow.open(map, this);
                    });
                    var marker1 = new google.maps.Marker({
                        map: map,
                        position: LatLng1,
                    });
                    var infowindow1 = new google.maps.InfoWindow();
                    infowindow1.setContent("<b>Your location<b/>");

                    google.maps.event.addListener(marker1, 'mousedown', function () {
                        if (activeWindow != null)
                            activeWindow.close();
                        activeWindow = infowindow1;
                        infowindow1.open(map, this);
                    });
                }
                else {
                    JSInterface.displayMessege("unable to find route");
                }
            });
            $(".ajaxloader").fadeOut("slow");
        }
        //*************************************STATUS OF VEHICLE**********************************
        function GetStatus(status) {
            if (status.indexOf('VI') > -1)
                return "Vehicle Idling";
            else if (status.indexOf('VH') > -1)
                return "Vehicle Halted";
            else if (status.indexOf('PBP') > -1)
                return "Panic Button Pressed";
            else if (status.indexOf('VM') > -1)
                return "Vehicle Moving";
            else if (status.indexOf('NR') > -1)
                return "Not Reachable";
            else
                return "Don't Know status";
        }

        function getAllTotalMarkers() {

                type: "POST",
                url: domain_url + "/Senselwebservice.asmx/GetAllPlacesDataByImei",
                data: RequestData,
                contentType: "application/json; charset=utf-8",
                dataType: "json",
                success: function (data) {
                    var Places = jQuery.parseJSON(data.d);
                    if (Places.length == 0) {
                        JSInterface.displayMessege("No Nearest Places");
                    }

                        if (isroute)
                            jrmRoute(Places);

                            for (var i = 0; i < Places.length; i++) {
                                createMarkerTotal(Places[i], current_position);
                            }
                        }

                        ];
                        for (i = 0; i < Places.length; i++) {
                            flightPlanCoordinates.push(new google.maps.LatLng(Places[i].Latitude, Places[i].Longitude));
                            if (minlat > parseFloat(Places[i].Latitude))
                                minlat = parseFloat(Places[i].Latitude);
                            if (minlong > parseFloat(Places[i].Longitude))

                        var bounds = new google.maps.LatLngBounds();

        //***********************************BLIND,ACCIDENT and PARKING SPOTS****************************************************
        function jrmRoute(spots) {
            isroute = true;
            getSourceDestination(spots);
            $("#legend").show();
        }
        //***********************************Route BLIND,ACCIDENT and PARKING SPOTS MARKERS****************************************************
        function createMarkerJRMByRoute(route, spots) {
            // $(".ajaxloader").fadeIn("slow");
            for (var i = 0; i < spots.length; i++) {
                var spotcount = 0;
                for (var k = 0; k < spotPoints.length; k++) {
                    if (i == spotPoints[k]) {
                        spotcount++;
                        break;
                    }
                }
                if (spotcount == 0) {
                    for (var j = 0; j < route.length; j++) {
                        if (Math.abs(spots[i].Latitude - route[j].Lat) <= 0.1) {
                            if (Math.abs(spots[i].Longitude - route[j].Lng) <= 0.1) {
                                var placeLoc = new google.maps.LatLng(spots[i].Latitude, spots[i].Longitude);
                                var image;
                                if (spots[i].Name == "Accident zone") {
                                    img = "red"
                                }
                                else if (spots[i].Name == "Parking") {
                                    img = "green";
                                }
                                else if (spots[i].Name == "Blind spot") {
                                    img = "yellow";
                                }
                                spotPoints.push(i);
                                markedSpots.push({ Name: spots[i].Name, Loc: placeLoc });
                                createMarkerJRM(spots[i], current_position, img);
                                break;
                            }
                        }
                    }
                }
            }

            $(".ajaxloader").fadeOut("slow");
        }
        function checkNightzone(lt, lg) {
            for (var j = 0; j < rectangles.length; j++) {
                var inOrOut = 0;
                if (lt >= rectangles[j]["pt1"].lat())
                    inOrOut++;
                if (lt <= rectangles[j]["pt2"].lat())
                    inOrOut++;
                if (lg >= rectangles[j]["pt1"].lng())
                    inOrOut++;
                if (lg <= rectangles[j]["pt2"].lng())
                    inOrOut++;
                if (inOrOut == 4) {
                    return true;
                }
            }
            return false;
        }

        function UpdateJRM(message) {
            if (activeWindow != null) {

            });

        function insertReason() {

            var r = document.getElementById("txtReason").value;

                return;
            }
            var place = activeWindow.getContent();
            place = place.substring(place.indexOf('<h4>') + 4, place.indexOf('</h4>'));
            var position = activeWindow.getPosition();
            var reqData = {
                IMEI: imei,
                violationType: place,
                latLng: position.lat() + "," + position.lng(),
                reason: r
            };
            $(".ajaxloader").fadeIn("slow");
            $.ajax({
                type: "POST",
                url: domain_url + "/Senselwebservice.asmx/InsertViolationReasons",
                data: JSON.stringify(reqData),
                contentType: "application/json; charset=utf-8",
