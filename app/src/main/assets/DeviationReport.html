<!DOCTYPE html>
<html>
  <head>
    <title>Deviation Report Map</title>
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no">
    <meta charset="utf-8">
    <style>
      #map {
        height: 100%;
      }
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      html, body, #map {
        height: 100%;
        margin: 0px;
        padding: 0px
      }

      #panel {
        position: absolute;
        top: 5px;
        left: 50%;
        margin-left: -180px;
        z-index: 5;
        background-color: #fff;
        padding: 5px;
        border: 1px solid #999;
      }

      #bar {
        width: 240px;
        background-color: rgba(255, 255, 255, 0.75);
        margin: 8px;
        padding: 4px;
        border-radius: 4px;
      }

      #autoc {
        width: 100%;
        box-sizing: border-box;
      }
    </style>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js"></script>

  </head>
  <body>
    <div id="map"></div>
    <div id="bar" style="margin-top:-10px;" hidden>
      <p class="auto"><input type="text" id="autoc"/></p>
    </div>
    <p id="clear" style="height:22px;width:45px;background-color:#fff;padding-top:7px;padding-left:4px;">Clear</p>
    <p id="gps" style="height:30px;width:30px;background-color:#fff;padding-top:7px;padding-left:4px;"><img height="20" width="20" src="gps.png"/></p>

    <script>
        var all_markers = [];
        var ismainpage = false;
        var map;
        var cLatLong = JSInterface.GetPlace();

        function resolveLatLong() {
            if (!cLatLong) {
                cLatLong = JSInterface.GetLocation();
                ismainpage = true;
            }
            if (!cLatLong) {
                cLatLong = "0,0";
            }
            return cLatLong;
        }

        function clearMarkers() {
            for (var i = 0; i < all_markers.length; ++i) {
                all_markers[i].setMap(null);
            }
            all_markers = [];
        }

        function getFormattedAddress(results) {
            if (!results || !results.length) {
                return null;
            }
            if (results[0] && results[0].formatted_address) {
                return results[0].formatted_address;
            }
            if (results[1] && results[1].formatted_address) {
                return results[1].formatted_address;
            }
            return null;
        }

        function placeMarker(latLng, targetMap) {
            clearMarkers();
            var marker = new google.maps.Marker({
                position: latLng,
                map: targetMap
            });
            all_markers.push(marker);

            var geocoder = new google.maps.Geocoder();
            geocoder.geocode({ latLng: latLng }, function (results, status) {
                if (status === google.maps.GeocoderStatus.OK) {
                    var address = getFormattedAddress(results);
                    if (address) {
                        JSInterface.setPlace(
                            "marker",
                            marker.getPosition().lat() + "," + marker.getPosition().lng(),
                            address
                        );
                    }
                }
            });
            return marker;
        }

        function initMap() {
            var res = resolveLatLong().split(",");
            var center = new google.maps.LatLng(parseFloat(res[0]), parseFloat(res[1]));
            map = new google.maps.Map(document.getElementById('map'), {
                center: center,
                zoom: 16
            });

            if (!ismainpage) {
                new google.maps.Marker({
                    position: center,
                    map: map
                });
            }

            if (ismainpage) {
                map.controls[google.maps.ControlPosition.TOP_CENTER].push(document.getElementById('clear'));
                map.controls[google.maps.ControlPosition.RIGHT_CENTER].push(document.getElementById('gps'));
                map.controls[google.maps.ControlPosition.LEFT_TOP].push(document.getElementById('bar'));
            }

            google.maps.event.addListener(map, "click", function (e) {
                map.setZoom(18);
                map.setCenter(e.latLng);
                placeMarker(e.latLng, map);
            });

            $('#clear').click(function (ev) {
                clearMarkers();
                JSInterface.ResetPlace();
                ev.preventDefault();
                return false;
            });

            $('#gps').click(function (ev) {
                var gpsLatLong = JSInterface.GetLocation();
                if (!gpsLatLong) {
                    JSInterface.displayMessege("Enable GPS Location");
                    return false;
                }
                var gpsRes = gpsLatLong.split(",");
                if (parseFloat(gpsRes[0]) === 0 && parseFloat(gpsRes[1]) === 0) {
                    JSInterface.displayMessege("Enable GPS Location");
                    return false;
                }
                var gpsPos = new google.maps.LatLng(parseFloat(gpsRes[0]), parseFloat(gpsRes[1]));
                map.setZoom(18);
                map.setCenter(gpsPos);
                placeMarker(gpsPos, map);
                return false;
            });
        }
    </script>
    <script type="text/javascript" src="https://maps.googleapis.com/maps/api/js?callback=initMap&client=gme-senseltelematics&v=3.15"></script>

  </body>
</html>
